# Executable standards for a research project.  Run: uvx lanorme check .
#
# All rules are enabled. In practice the production-application rules (hexagonal
# layers, auth on mutation endpoints, a test partner per module, AAA-structured
# tests) do not fire on a research layout — they need directories and patterns a
# research project does not have — so there is nothing to disable up front. A
# fresh install reports only the TYPE-001 warning ignored below.
#
# The rules that DO earn their place here:
#
#   SKILL-001..006  a malformed SKILL.md silently fails to load, and skills are
#                   shared between teammates and machines.
#   COMPLEXITY/SIZE the documented AI-scientist failure mode "false performance
#                   gains from buggy code" (see research/ai-scientist-pitfalls/)
#                   lives in exactly the long, high-complexity analysis function
#                   nobody can review.
#   secrets         model-provider API keys in a research script are a common leak.
#   DRY-001         copy-pasted analysis that drifts is how two "independent"
#                   results quietly become one.
#   JUNK-001/002    keeps results/ and notes/ readable as an evidence trail.
#
# FORMAT: keys are TOP-LEVEL here. The [tool.lanorme] table form is only for
# pyproject.toml — using it in this file parses fine and applies nothing.
#
# If a rule starts fighting the work rather than catching mistakes, add its ID
# to `ignore` with a one-line reason — the way this file documents its own
# choice. Silent suppression is the thing to avoid, not suppression itself.

plugins = [
    "lanorme_plugins.tensors",
    "lanorme_plugins.skill_portability",
    "lanorme_plugins.provenance",
    "lanorme_plugins.staleness",
]

select = ["ALL"]


ignore = [
    # Parsed YAML/JSON at an I/O boundary is genuinely untyped — dict[str, object]
    # is the honest annotation, not a placeholder for a missing domain type.
    "TYPE-001",
    # Reference implementations import torch lazily so they stay runnable and
    # lintable on a machine with no GPU.
    "IMPORT-001",
]

exclude = [
    ".claude/worktrees",  # parallel-session worktrees: their contents are scanned in their own session

    # Exploratory code is EXEMPT BY DESIGN. Most research work is de-risking in
    # notebooks and throwaway scripts, where time-to-insight is the only metric
    # that matters and polish is deferred on purpose (see the experiment-engineering
    # skill's two-mode table). Linting this code would tax exactly the phase that
    # should be cheapest. Quality gates apply at PROMOTION — when code moves to
    # scripts/ or src/ because a claim will rest on it or someone else must run it.
    #
    # Note this exempts POLISH, not correctness: the observability contract
    # (structured logs, resumable checkpoints, seeds, shuffling) still applies to
    # any run that costs real time or money, because unlogged fast work has to be
    # re-run — and re-running is slower than logging was.
    "notebooks/**",
    "explore/**",
    "scratch/**",
    "experiments/**",  # dated experiment folders — promote to scripts/ when reused
    "**/*.ipynb",

    "data/**",         # downloaded papers and inputs
    "results/**",      # experiment outputs are evidence, not source
    "notes/**",        # working notes and source records
    "references/**",
    "research/**",
]

# PROV-003 (statistics must carry a claim marker) is opt-in and applies only
# to files matched here. Point it at whatever holds your deliverables.
[provenance]
claim_bearing = ["reports/**/*.md", "findings/**/*.md"]

# Codex reads skills from .agents/skills; Claude Code reads .claude/skills. The
# installer symlinks the first to the second so both find the same files.
# HSKILL-003 warns if that link is missing, broken, or has become a stale copy.
# Set false if this project targets Claude Code only.
[skill_portability]
check_codex_skills = true

# STALE-001 warns when the research tree stops keeping pace with the work.
# STALE-002 needs dated_docs set: it compares a document's `updated:`
# frontmatter against the date git last saw the file change.
[staleness]
watch = ["results"]
artefacts = ["TREE.md", "RESEARCH_LOG.md"]
max_commits_behind = 8
dated_docs = ["reports/**/*.md", "findings/**/*.md"]

# Size rules, silenced per file with a reason each.
#
# lanorme's thresholds are module constants (FILE_WARN_LINES=300/500,
# FUNC 50/80, PARAM 5/8) and are NOT configurable, so there is no limit to
# raise. What IS available is this table, which is better than a baseline
# here: 21 findings in 10 files, each listed next to why it is allowed,
# rather than a 155-entry JSON blob nobody reads.
#
# The trade-off, stated plainly: unlike a baseline this does NOT ratchet.
# A file listed below can grow without the gate objecting, so a rule silenced
# here should be re-earned whenever the file is substantially rewritten.
#
# Only HARD errors are listed. The 300-line file warnings and the 50-line
# function warnings still print, and are still worth reading.
[per-file-ignores]

# A page template, not a program: 2,377 lines that are almost entirely HTML,
# CSS and JavaScript held in Python strings. Splitting it would scatter one
# document across files. The gate already proves the page it emits is
# byte-identical, which is the property that actually matters.
"docs/build.py" = ["SIZE-001"]

# Plotly figure builders. A figure function legitimately takes 8-9 parameters
# (data, labels, layer, colours, height, title, anchors) and runs long because
# it is one figure's full specification: trace, axes, legend, reference lines,
# annotations. Splitting mid-figure hurts more than it helps.
"src/emotion_vectors/interactive.py" = ["SIZE-001", "SIZE-002", "PARAM-001"]
"src/emotion_vectors/trajectory_plots.py" = ["SIZE-001", "SIZE-002"]
"src/emotion_vectors/linked_trajectory.py" = ["SIZE-002", "PARAM-001"]
"src/emotion_vectors/sprint_report/_act4_act5.py" = ["SIZE-002"]
"src/emotion_vectors/sprint_report/_act6_dynamics.py" = ["SIZE-002"]

# A script's main() is argparse plus top-to-bottom orchestration. Reading it
# in one piece IS the point; factoring it into helpers called once each makes
# the run order harder to follow, not easier.
"scripts/bench_vllm_activations.py" = ["SIZE-002"]
"scripts/score_preferences.py" = ["SIZE-002"]
"scripts/score_steering.py" = ["SIZE-002"]
"scripts/combined_story_gen/generate_combined_stories.py" = ["SIZE-002"]
"scripts/combined_story_gen/generate_combined_openrouter.py" = ["SIZE-002"]

# bootstrap_stability takes both scenario sets, both target arrays, the layer
# positions and the generator: eight inputs that are one falsification run's
# full specification.
"scripts/falsify_c4_gate.py" = ["PARAM-001"]
