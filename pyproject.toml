[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma4-emotion-vectors"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.24.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jaxtyping>=0.3.11",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "transformers>=4.51",
]

[project.optional-dependencies]
# Heavy CUDA stack, pod-only. On the RunPod box: uv sync --extra gpu
gpu = [
    "accelerate>=1.14.0",
    "torch",             # unpinned: vllm pins a specific torch, let it resolve
    "vllm>=0.11",        # pod-only; pins its own torch — install into the gpu extra
]

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_vectors"]

[tool.ruff]
# Report notebooks are promoted deliverables and get linted like any code;
# only the bench history in archive/ keeps its explore-mode exemption.
extend-exclude = ["notebooks/archive", ".claude/worktrees"]
line-length = 100
# Deliberately BELOW requires-python (>=3.14). This controls the syntax ruff
# may EMIT, not what the project runs on. At py314 the formatter applies
# PEP 758 and rewrites `except (A, B):` to `except A, B:` — valid on 3.14,
# and a Python 2 error to every reader who has not read that PEP. It touched
# extraction.py and three lanorme plugins for no benefit.
target-version = "py311"

[tool.ruff.format]
# Notebooks are linted but NOT formatted. `ruff format` rewrites the entire
# .ipynb JSON, and its float serialiser round-trips stored output values to a
# different last digit: -0.013585043197963387 became ...389. The numbers are
# unchanged to any precision that matters, but one formatting pass rewrote
# 1,007 floats in a single plotly output and produced an 84,000-line diff on
# notebook 09. That buries real changes and churns committed evidence, so the
# formatter stays off the notebooks and the code cells keep whatever shape
# their author gave them.
exclude = ["*.ipynb"]

[tool.ruff.lint]
# I: import sorting. PLC0415: imports belong at module top — the only sanctioned
# exception (documented noqa) is loading the torch-importing pipeline lazily so
# laptop-side tools run without the gpu extra. Other lint belongs to lanorme.
select = ["I", "PLC0415"]
