[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbai-cambria-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.24.0",
    "ipykernel>=7.3.0",
    "jaxtyping>=0.3.11",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "transformers>=4.51",
]

[project.optional-dependencies]
# Heavy CUDA stack, pod-only. On the RunPod box: uv sync --extra gpu
gpu = [
    "accelerate>=1.14.0",
    "torch",             # unpinned: vllm pins a specific torch, let it resolve
    "vllm>=0.11",        # pod-only; pins its own torch — install into the gpu extra
]

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_vectors"]

[tool.ruff]
# Report notebooks are promoted deliverables and get formatted like any code;
# only the bench history in archive/ keeps its explore-mode exemption.
extend-exclude = ["notebooks/archive", ".claude/worktrees"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# I: import sorting. PLC0415: imports belong at module top — the only sanctioned
# exception (documented noqa) is loading the torch-importing pipeline lazily so
# laptop-side tools run without the gpu extra. Other lint belongs to lanorme.
select = ["I", "PLC0415"]
