[project]
name = "cbai-cambria-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.24.0",
    "ipykernel>=7.3.0",
    "jaxtyping>=0.3.11",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "transformers>=4.51",
]

[project.optional-dependencies]
# Heavy CUDA stack, pod-only. On the RunPod box: uv sync --extra gpu
gpu = [
    "accelerate>=1.14.0",
    "torch>=2.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["I"]  # import sorting; other lint belongs to lanorme
